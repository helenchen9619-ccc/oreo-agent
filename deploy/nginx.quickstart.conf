# 快速开始专用站点：纯 HTTP（本地评估用），托管前端 dist + 反代 /api 到 app 容器。
# 生产部署请用 deploy/nginx.conf.example（含 HTTPS/证书/缓存策略）。
server {
    listen 80;

    client_max_body_size 100m;  # 与平台上传上限一致

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:8000;
        # SSE 流式：关缓冲 + 长读超时，缺一不可
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # hash 资产长缓存；缺失时 404 而不是 fallback 成 HTML（否则 module 脚本收到 text/html → 白屏）
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA 兜底：前端路由全部回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
